<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-card">
    <div class="header-row">
      <span class="logo">TA<span id="logo-dot" class="logo-dot">.</span></span>
      <span id="streak" class="streak"></span>
    </div>

    <div class="device-wrap">
      <div id="device" class="device">
        <div id="frame" class="frame">
          <div class="screen">
            <div class="screen-texture"></div>
            <div class="screen-content">
              <div class="screen-topline">
                <span id="species-label"></span>
                <span id="clock"></span>
              </div>
              <div class="sprite-wrap">
                <div id="pet-sprite" class="sprite-grid"></div>
              </div>
              <div id="lcd-status" class="lcd-status"></div>
            </div>
          </div>
        </div>

        <div class="buttons">
          <button id="btn-options" class="device-btn" title="Configurações">⚙</button>
          <button id="btn-refresh" class="device-btn" title="Atualizar">⟳</button>
          <button id="btn-extra" class="device-btn" title="Em breve" disabled>♥</button>
        </div>
      </div>
    </div>

    <div class="mood-block">
      <span id="mood-title" class="mood-title"></span>
      <span id="mood-blurb" class="mood-blurb"></span>
    </div>

    <div class="stats-card">
      <div class="stat-row">
        <div class="stat-head">
          <span class="stat-label">Felicidade</span>
          <span id="happiness-value" class="stat-value">0</span>
        </div>
        <div class="stat-track"><div id="happiness-bar" class="stat-fill"></div></div>
      </div>
      <div class="stat-row">
        <div class="stat-head">
          <span class="stat-label">Energia</span>
          <span id="energy-value" class="stat-value">0</span>
        </div>
        <div class="stat-track"><div id="energy-bar" class="stat-fill"></div></div>
      </div>
      <div class="stat-row">
        <div class="stat-head">
          <span class="stat-label">Fome</span>
          <span id="hunger-value" class="stat-value">0</span>
        </div>
        <div class="stat-track"><div id="hunger-bar" class="stat-fill"></div></div>
      </div>
    </div>

    <div id="open-options-link" class="options-link">Configurações</div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
