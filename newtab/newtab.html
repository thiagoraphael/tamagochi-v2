<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div class="pet-container">
    <img id="pet-sprite" src="" alt="Seu bichinho" />
    <p id="pet-mood-text"></p>

    <div class="status-bars">
      <div class="bar">
        <label>Felicidade</label>
        <progress id="happiness-bar" value="0" max="100"></progress>
        <span id="happiness-value">0</span>
      </div>
      <div class="bar">
        <label>Energia</label>
        <progress id="energy-bar" value="0" max="100"></progress>
        <span id="energy-value">0</span>
      </div>
      <div class="bar">
        <label>Fome</label>
        <progress id="hunger-bar" value="0" max="100"></progress>
        <span id="hunger-value">0</span>
      </div>
    </div>

    <div class="top-sites">
      <h3>Tempo hoje por site</h3>
      <ul id="top-sites-list"></ul>
    </div>
  </div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
