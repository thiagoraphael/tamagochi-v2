<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <div id="device" class="device">
    <div class="device-label">TAMAGOTCHI</div>

    <div class="screen-frame">
      <div class="screen">
        <div id="pet-sprite" class="sprite-grid"></div>
      </div>
    </div>

    <div class="buttons">
      <button class="device-btn" id="btn-options" title="Configurações"></button>
      <button class="device-btn" id="btn-refresh" title="Atualizar"></button>
    </div>

    <p id="pet-mood-text" class="mood-text"></p>

    <div class="status-card">
      <div class="bar-row">
        <span class="bar-label">Felicidade</span>
        <div class="bar-track"><div id="happiness-bar" class="bar-fill happiness" style="width: 0%"></div></div>
        <span id="happiness-value" class="bar-value">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Energia</span>
        <div class="bar-track"><div id="energy-bar" class="bar-fill energy" style="width: 0%"></div></div>
        <span id="energy-value" class="bar-value">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Fome</span>
        <div class="bar-track"><div id="hunger-bar" class="bar-fill hunger" style="width: 0%"></div></div>
        <span id="hunger-value" class="bar-value">0</span>
      </div>
    </div>

    <div class="top-sites">
      <h3>Tempo hoje por site</h3>
      <ul id="top-sites-list"></ul>
    </div>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
